<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Auto Studio V3.2 Pro Dark</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4">
    <div class="max-w-5xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- 헤더 -->
        <div class="bg-gradient-to-r from-indigo-900 via-slate-900 to-slate-900 px-8 py-6 border-b border-slate-800 flex justify-between items-center">
            <div>
                <span class="bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-md font-semibold">V3.2 Pro</span>
                <h1 class="text-2xl font-bold mt-2 text-white">Shorts Auto Studio — Free Workflow</h1>
                <p class="text-slate-400 text-sm mt-1">기준 이미지 캐릭터 고정 및 상세 씬별 연출 자동화 대시보드</p>
            </div>
        </div>

        <!-- 본문 설정 영역 -->
        <div class="p-8 space-y-6">
            <!-- API 키 입력 -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">🔑 Gemini API 키</label>
                <input type="password" id="apiKey" placeholder="AI Studio API 키를 입력하세요" 
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- 프로젝트 설정 카드 -->
            <div class="bg-slate-950/50 p-5 rounded-xl border border-slate-800 space-y-4">
                <h2 class="text-sm font-semibold text-indigo-400 uppercase tracking-wider">📌 프로젝트 설정</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">주제</label>
                        <input type="text" id="topic" value="우주에서 라면 먹는 고양이" 
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">장르/분위기</label>
                        <input type="text" id="genre" value="시네마틱, 유머러스, SF 코미디" 
                            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">목표 길이</label>
                        <select id="shortsLength" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="30초 (3컷 구성)">30초 (3컷 구성)</option>
                            <option value="60초 (5컷 구성)" selected>60초 (5컷 구성)</option>
                        </select>
                    </div>
                </div>

                <!-- 주인공 기준 이미지 업로드 -->
                <div class="pt-2">
                    <label class="block text-xs font-medium text-indigo-300 mb-1">🖼️ 주인공 기준 이미지 업로드 (캐릭터 일관성 고정용)</label>
                    <input type="file" id="imageInput" accept="image/*" 
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                    <div id="imagePreviewContainer" class="mt-3 hidden flex items-center space-x-3">
                        <img id="imagePreview" class="w-16 h-16 object-cover rounded-lg border border-slate-700 shadow-sm">
                        <span class="text-xs text-emerald-400 font-medium">✨ 기준 캐릭터 이미지가 등록되었습니다. 모든 씬에 이 외모가 고정 반영됩니다!</span>
                    </div>
                </div>
            </div>

            <!-- 생성 버튼 -->
            <button onclick="generatePrompts()" id="generateBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
                🚀 AI 맞춤 스토리보드 패키지 생성하기
            </button>

            <!-- 로딩 상태 -->
            <div id="loading" class="hidden text-center py-10">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
                <p class="text-sm text-slate-400 mt-3">AI가 캐릭터 특징을 분석하고 상세 연출 씬을 구성하고 있습니다... ⏳</p>
            </div>

            <!-- 에러 메시지 -->
            <div id="errorContainer" class
