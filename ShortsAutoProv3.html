<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>YouTube Shorts Prompt Generator</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.5; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; }
    .video-entry { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #f9f9f9; }
    .video-entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    button { padding: 8px 16px; cursor: pointer; }
    .btn-container { display: flex; gap: 10px; margin-top: 15px; }
    #output { margin-top: 16px; height: 180px; }
  </style>
</head>
<body>

  <h2>유튜브 프롬프트 생성기</h2>

  <div class="form-group">
    <label for="topic">주제 (Topic)</label>
    <input type="text" id="topic" placeholder="예: 2026 AI 자동화 트렌드">
  </div>

  <div class="form-group">
    <label for="genre">장르/톤앤매너 (Genre/Tone)</label>
    <select id="genre">
      <option value="정보 전달 / 테크 리뷰">정보 전달 / 테크 리뷰</option>
      <option value="스토리텔링 / 흥미 유발">스토리텔링 / 흥미 유발</option>
      <option value="유머 / 엔터테인먼트">유머 / 엔터테인먼트</option>
      <option value="교육 / 튜토리얼">교육 / 튜토리얼</option>
    </select>
  </div>

  <div class="form-group">
    <label for="targetLength">목표 영상 길이 (Target Length)</label>
    <select id="targetLength">
      <option value="Shorts (30초 이내)">Shorts (30초 이내)</option>
      <option value="Shorts (60초 이내)">Shorts (60초 이내)</option>
      <option value="Long-form (3~5분)">Long-form (3~5분)</option>
      <option value="Long-form (10분 내외)">Long-form (10분 내외)</option>
    </select>
  </div>

  <hr>

  <h3>참고 유튜브 영상 데이터 (최소 5~6개 권장 또는 비워두기 가능)</h3>
  <div id="videoContainer"></div>
  <button type="button" onclick="addVideoField()">+ 영상 추가 (6개 이상)</button>

  <div class="btn-container">
    <button type="button" onclick="generatePromptWithYouTube()" style="background-color: #007bff; color: #fff; border: none; flex: 1;">① 유튜브 벤치마킹 분석 및 프롬프트 생성</button>
    <button type="button" onclick="generatePromptWithoutYouTube()" style="background-color: #28a745; color: #fff; border: none; flex: 1;">② 유튜브 없이 주제만으로 프롬프트 생성</button>
  </div>

  <div class="form-group" style="margin-top: 20px;">
    <label for="output">생성된 프롬프트 (Prompt Output)</label>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    let videoIndex = 0;

    function addVideoField(title = '', details = '') {
      videoIndex++;
      const container = document.getElementById('videoContainer');
      const div = document.createElement('div');
      div.className = 'video-entry';
      div.id = `videoRow_${videoIndex}`;
      div.innerHTML = `
        <div class="video-entry-header">
          <strong>영상 #${videoIndex}</strong>
          ${videoIndex > 1 ? `<button type="button" onclick="removeVideoField('videoRow_${videoIndex}')">삭제</button>` : ''}
        </div>
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
          <input type="text" class="v-title" placeholder="영상 제목 / 핵심 키워드" value="${title}">
          <input type="text" class="v-details" placeholder="조회수 요인, 훅(Hook), 핵심 내용 요약" value="${details}">
        </div>
      `;
      container.appendChild(div);
    }

    function removeVideoField(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // Initialize with 5 default video input rows
    window.onload = function() {
      for (let i = 0; i < 5; i++) {
        addVideoField();
      }
    };

    // 1번 버튼: 유튜브 입력 데이터를 분석하여 프롬프트 생성
    function generatePromptWithYouTube() {
      const topic = document.getElementById('topic').value.trim() || '미지정 주제';
      const genre = document.getElementById('genre').value;
      const targetLength = document.getElementById('targetLength').value;

      const titleElements = document.querySelectorAll('.v-title');
      const detailElements = document.querySelectorAll('.v-details');

      const collectedVideos = [];
      for (let i = 0; i < titleElements.length; i++) {
        const title = titleElements[i].value.trim();
        const details = detailElements[i].value.trim();
        if (title || details) {
          collectedVideos.push(`- 영상 ${collectedVideos.length + 1}: [제목/키워드] ${title || 'N/A'} | [분석/훅] ${details || 'N/A'}`);
        }
      }

      if (collectedVideos.length === 0) {
        alert("입력된 유튜브 참고 영상이 없습니다. 유튜브 데이터 없이 생성하려면 2번 버튼을 이용해주세요.");
        return;
      }

      const referenceSection = collectedVideos.join('\n');

      const promptTemplate = 
`[역할 부여]
당신은 유튜브 알고리즘 및 바이럴 콘텐츠 전문 기획자 겸 스크립트 라이터입니다.

[프로젝트 기본 설정]
- 메인 주제: ${topic}
- 장르 및 톤앤매너: ${genre}
- 목표 영상 길이: ${targetLength}

[참고 벤치마킹 영상 분석 데이터 (총 ${collectedVideos.length}건)]
${referenceSection}

[작업 지시사항]
1. 벤치마킹 분석: 위 입력된 ${collectedVideos.length}개 영상의 공통 후킹 구조, 시청자 이탈 방지 패턴, 핵심 키워드를 도출하세요.
2. 기획 차별화: 기존 성공 요소를 계승하되, '${topic}' 주제에 특화된 차별화된 앵글을 정의하세요.
3. 스크립트 작성:
   - 초반 0~3초: 시청 지속률을 극대화하는 강력한 훅(Hook)
   - 본론: 핵심 포인트 중심의 빠른 호흡 전개 (${targetLength} 규격 준수)
   - 결론: 명확한 CTA(구독/댓글 유도) 및 마무리
4. 화면 연출 가이드: 텍스트 스크립트 외에 자막 타이밍, 시각적 전환(B-roll), 효과음 제안을 포함해 표 형태로 출력하세요.`;

      document.getElementById('output').value = promptTemplate;
    }

    // 2번 버튼: 유튜브 없이 주제 및 스타일 설정만으로 프롬프트 생성
    function generatePromptWithoutYouTube() {
      const topic = document.getElementById('topic').value.trim() || '미지정 주제';
      const genre = document.getElementById('genre').value;
      const targetLength = document.getElementById('targetLength').value;

      const promptTemplate = 
`[역할 부여]
당신은 유튜브 알고리즘 및 바이럴 콘텐츠 전문 기획자 겸 스크립트 라이터입니다.

[프로젝트 기본 설정]
- 메인 주제: ${topic}
- 장르 및 톤앤매너: ${genre}
- 목표 영상 길이: ${targetLength}

[참고 벤치마킹 영상 분석 데이터]
- 제공된 레퍼런스 데이터 없음 (일반 최적화 적용)

[작업 지시사항]
1. 기획 방향성: '${topic}' 주제에 특화된 독창적이고 매력적인 앵글을 정의하세요.
2. 스크립트 작성:
   - 초반 0~3초: 시청 지속률을 극대화하는 강력한 훅(Hook)
   - 본론: 핵심 포인트 중심의 빠른 호흡 전개 (${targetLength} 규격 준수)
   - 결론: 명확한 CTA(구독/댓글 유도) 및 마무리
3. 화면 연출 가이드: 텍스트 스크립트 외에 자막 타이밍, 시각적 전환(B-roll), 효과음 제안을 포함해 표 형태로 출력하세요.`;

      document.getElementById('output').value = promptTemplate;
    }
  </script>
</body>
</html>
