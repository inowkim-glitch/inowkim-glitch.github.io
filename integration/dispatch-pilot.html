<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>진일 발주·송부 연동 시험</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f6f8;color:#152f40;margin:0;padding:18px}main{max-width:760px;margin:auto;background:#fff;border-radius:16px;padding:20px}label{display:block;margin-top:14px;font-weight:650}input,textarea,select,button{font:inherit;padding:10px;box-sizing:border-box;width:100%;margin-top:5px;border-radius:8px;border:1px solid #c5d0d7}button{background:#205467;color:#fff;cursor:pointer;margin-top:10px}button:disabled{opacity:.5}article{border:1px solid #d2dfe4;border-radius:10px;padding:10px;margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9f1f4;padding:12px}small{color:#50616b}</style></head>
<body><main><h2>진일 발주·송부 통합 시험</h2><p><small>V72 원본과 별개인 시험 화면입니다. 본사·생산·가공 실기기 검증 전 운영 사용 금지.</small></p>
<section id="loginSection"><label>이메일<input id="email" type="email" autocomplete="username"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><button id="login">로그인</button></section>
<section id="workspace" hidden><p id="identity"></p><button id="logout">로그아웃</button>
<h3>발주 저장·송부 (총무부)</h3><label>발주번호<input id="orderNo" placeholder="TEST-20261123-001"></label><label>발주 요약 JSON<textarea id="payload" rows="3">{}</textarea></label>
<button id="saveOrder">1. 발주 저장</button><p id="saved"></p>
<label>송부 대상 부서(복수 선택)<select id="recipients" multiple size="3"><option value="생산부">생산부</option><option value="가공부">가공부</option><option value="테프론부">테프론부</option></select></label>
<button id="sendOrder" disabled>2. 선택 부서로 송부</button>
<h3>부서별 대기 목록</h3><label>조회 부서<select id="department"><option value="생산부">생산부</option><option value="가공부">가공부</option><option value="테프론부">테프론부</option></select></label>
<button id="reload">목록 새로고침</button><div id="queue"></div></section><pre id="status" role="status">연결 준비</pre>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {createOrder,sendOrder,loadDepartmentQueue,transitionOrder,watchDepartmentQueue,canonicalDepartment} from './jinil-supabase-orders-adapter-v1.js';
const $=id=>document.getElementById(id);
const config=JSON.parse(localStorage.getItem('jinil_config')||'{}');
let sb=null,profile=null,savedOrder=null,unwatch=null,working=false;
const say=v=>$('status').textContent=v;
function setBusy(value){working=value;for(const id of ['saveOrder','sendOrder','reload'])$(id).disabled=value||(id==='sendOrder'&&!savedOrder)}
async function init(){
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(config.url||'')||!config.key){say('먼저 상위 index.html에서 Supabase 공개 키와 URL을 설정하세요.');return}
 sb=createClient(config.url,config.key,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.onAuthStateChange(()=>setTimeout(syncSession,0));await syncSession();
}
async function syncSession(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){profile=null;savedOrder=null;$('workspace').hidden=true;$('loginSection').hidden=false;unwatch?.();unwatch=null;say('로그인 후 시험할 수 있습니다.');return}
 const {data,error}=await sb.from('profiles').select('department,role').eq('id',user.id).single();
 if(error||!data){say('프로필 권한 조회 실패: '+(error?.message||'프로필 없음'));return}
 profile=data;$('workspace').hidden=false;$('loginSection').hidden=true;
 $('identity').textContent='접속: '+user.email+' / '+profile.department+' / '+profile.role;
 const department=canonicalDepartment(profile.department);if(['생산부','가공부','테프론부'].includes(department))$('department').value=department;
 $('saveOrder').disabled=!canSend();$('sendOrder').disabled=!canSend()||!savedOrder;
 await reload();subscribe();say('인증 및 부서 확인 완료');
}
function canSend(){return profile && (canonicalDepartment(profile.department)==='총무부'||profile.role==='admin')}
function subscribe(){unwatch?.();unwatch=watchDepartmentQueue(sb,{department:$('department').value,onChange:()=>reload()})}
$('login').onclick=async()=>{if(!sb)return;const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});say(error?'로그인 실패: '+error.message:'로그인 확인 중');};
$('logout').onclick=async()=>{if(sb)await sb.auth.signOut()};
$('saveOrder').onclick=async()=>{if(!canSend())return say('총무부 또는 관리자만 발주를 저장할 수 있습니다.');setBusy(true);try{
 const payload=JSON.parse($('payload').value);if(!payload||typeof payload!=='object'||Array.isArray(payload))throw Error('발주 요약은 JSON 객체여야 합니다.');
 savedOrder=await createOrder(sb,{orderNumber:$('orderNo').value,payload});$('saved').textContent='저장된 발주: '+savedOrder.order_no+' / '+savedOrder.id;say('서버 저장 성공');}
 catch(e){say('발주 저장 실패: '+e.message)}finally{setBusy(false)}};
$('sendOrder').onclick=async()=>{if(!canSend()||!savedOrder)return say('먼저 발주를 저장하세요.');const recipients=[...$('recipients').selectedOptions].map(x=>x.value);if(!recipients.length)return say('송부 부서를 선택하세요.');
 if(!confirm('선택한 '+recipients.join(', ')+'에 발주를 송부하시겠습니까?'))return;
 setBusy(true);try{const rows=await sendOrder(sb,{orderId:savedOrder.id,recipients});say(rows.length+'개 부서 송부 완료');savedOrder=null;$('saved').textContent='송부 완료. 새 발주는 다시 저장하세요.';await reload();}
 catch(e){say('송부 실패: '+e.message+' / 중복 송부 전 서버 조회 필요')}finally{setBusy(false)}};
async function reload(){if(!sb||!profile)return;try{const list=await loadDepartmentQueue(sb,{department:$('department').value});const box=$('queue');box.replaceChildren();if(!list.length)box.textContent='표시 가능한 송부가 없습니다.';for(const item of list){
 const article=document.createElement('article');const title=document.createElement('div');title.textContent=(item.order_summary?.order_no||item.order_id)+' / '+item.department+' / '+item.status;article.append(title);
 const next=item.status==='대기'?'확인':item.status==='확인'?'완료':null;
 if(next){const button=document.createElement('button');button.textContent=next+' 처리';button.onclick=async()=>{button.disabled=true;try{await transitionOrder(sb,{dispatchId:item.id,expectedStatus:item.status,nextStatus:next});say('상태 변경 완료: '+next);await reload()}catch(e){say(e.message);await reload()}finally{button.disabled=false}};article.append(button)}
 box.append(article)}
 }catch(e){say('목록 조회 실패: '+e.message)}}
$('reload').onclick=reload;$('department').onchange=()=>{reload();subscribe()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&profile)reload()});setInterval(()=>{if(profile)reload()},60000);
init().catch(e=>say('초기화 실패: '+e.message));
</script></body></html>
