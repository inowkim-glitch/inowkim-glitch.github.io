<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>진일 | 총무부 납품예정달력</title><link rel="stylesheet" href="../../../department.css"><style>body{padding:16px}main{max-width:1060px;margin:auto;background:white;border:1px solid #dce6df;border-radius:16px;padding:22px}h1{font-size:23px}p{line-height:1.6}.warning{padding:12px;border:1px solid #dfc89b;border-radius:9px;background:#fff8e9;color:#72501d}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}input,select,textarea{padding:9px;border:1px solid #bacbbc;border-radius:8px;max-width:100%;font:inherit}button{background:#24523d;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer}button:disabled{opacity:.5}.tools input{flex:1;min-width:160px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{display:grid;gap:5px;font-size:13px;font-weight:700}label input,label textarea{width:100%}#records{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #dce4dc;padding:11px 8px;text-align:left;vertical-align:top;font-size:13px}td{overflow-wrap:anywhere}th{background:#f5f8f5}.secondary{background:#e9eee9;color:#234}#status{color:#536c59;font-size:13px}.panel{border:1px solid #dce5dd;padding:16px;border-radius:12px;margin:14px 0}@media(max-width:600px){main{padding:14px}table{min-width:640px}}</style></head><body><main><p><a href="../../../index.html">← WORKSPACE</a></p><h1>총무부 · 납품예정달력</h1><p class="warning"><strong>서버 연동 개발용 화면</strong> · Supabase 인증과 권한에 따라 조회·저장합니다. V72 원본 업무 기능 전체 이식 및 서울·화성 실기기 검증은 아직 완료되지 않았습니다. 기존 로컬 기록은 자동 이관되지 않습니다.</p><section class="panel"><h2>로컬 시험 입력</h2><form id="edit"><div class="fields"><label>발주번호<input name="f0" type="text" required></input></label><label>업체명<input name="f1" type="text" ></input></label><label>품목<input name="f2" type="text" ></input></label><label>납품예정일<input name="f3" type="date" ></input></label><label>진행상태<input name="f4" type="text" ></input></label></div><div class="tools"><button type="submit">로컬 저장</button><button type="reset" class="secondary">입력 초기화</button></div></form></section><section class="panel"><h2>조회 및 필터</h2><div class="tools"><input id="query" aria-label="검색" placeholder="전체 항목 검색"><button id="export" class="secondary">CSV 내보내기</button><button id="clear" class="secondary">로컬 데이터 삭제</button></div><p id="status" role="status"></p><div id="records"><table><thead><tr><th>발주번호</th><th>업체명</th><th>품목</th><th>납품예정일</th><th>진행상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section><script>window.JINIL_WORKSPACE_CONFIG={"key":"총무부:납품예정달력","department":"총무부","readonly":true,"calendar":true};</script><script type="module" src="../../../common/workspace-records.js"></script></main></body></html>
