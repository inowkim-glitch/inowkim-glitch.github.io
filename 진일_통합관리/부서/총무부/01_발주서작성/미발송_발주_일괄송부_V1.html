<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>진일 통합관리 | 미발송 발주 일괄 송부</title>
<style>
:root{font-family:"Malgun Gothic",sans-serif;color:#213b2e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0;padding:18px}
main{max-width:1060px;margin:auto;background:#fff;padding:24px;border-radius:15px;border:1px solid #dce6dd}h1{font-size:23px}
section{border-top:1px solid #dce6dd;margin-top:20px;padding-top:16px}label{display:block;margin:8px 0}
input,button{font:inherit;padding:9px;border:1px solid #aabbab;border-radius:7px}input[type=email],input[type=password],input[type=url],input[type=text]{width:100%;max-width:530px}
button{background:#28563e;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.entry{display:flex;gap:14px;align-items:center;padding:11px;border:1px solid #dce6dd;margin:7px 0;border-radius:9px}.entry span{flex:1;overflow-wrap:anywhere}
#message{white-space:pre-wrap;background:#eef5ed;padding:13px;border-radius:8px;min-height:44px}small{color:#586a5e}a{color:#28563e}
</style></head><body><main>
<p><a href="01_발주서작성_V1.html">← 발주서작성으로 돌아가기</a></p>
<h1>총무부 · 미발송 발주 일괄 송부</h1>
<p>서버에 저장됐으나 어느 부서에도 송부되지 않은 발주만 표시합니다. 체크한 발주를 선택한 부서로 송부합니다.</p>
<section><h2>Supabase 로그인</h2>
<label>프로젝트 주소 <input id="url" type="url" placeholder="https://example.supabase.co"></label>
<label>공개용 publishable/anon 키 <input id="key" type="text" autocomplete="off"></label>
<label>이메일 <input id="email" type="email"></label><label>비밀번호 <input id="password" type="password"></label>
<div class="row"><button id="login">연결/로그인</button><button id="logout">로그아웃</button><small id="identity">로그인 전</small></div></section>
<section id="workspace" hidden><h2>서버 미발송 목록</h2>
<div class="row"><button id="reload">목록 새로고침</button><button id="all">전체 선택</button><button id="none">선택 해제</button><small id="count"></small></div>
<div id="orders"></div>
<h3>송부 대상 부서</h3><div class="row">
<label><input type="checkbox" name="dept" value="생산부"> 생산부</label>
<label><input type="checkbox" name="dept" value="가공부"> 가공부</label>
<label><input type="checkbox" name="dept" value="테프론부"> 테프론부</label></div>
<p><button id="send" disabled>선택 발주 일괄 송부</button></p>
<small>일부만 성공하면 즉시 중단하고 서버 목록을 다시 조회합니다. 송부 완료 여부 확인 전에는 재실행하지 마세요.</small></section>
<pre id="message" role="status">연결 대기 중</pre>
<script type="module">
import {sendOrder,canonicalDepartment} from '../../../../integration/jinil-supabase-orders-adapter-v1.js';
const $=id=>document.getElementById(id);
const log=s=>$('message').textContent=s;
let sb=null,profile=null,rows=[],busy=false,complete=false;
const cfg=(()=>{try{return JSON.parse(localStorage.getItem('jinil_config')||'{}')}catch{return {}}})();
$('url').value=cfg.url||'';$('key').value=cfg.key||'';
function setBusy(v){busy=v;for(const id of ['login','logout','reload','all','none'])$(id).disabled=v;updateCount()}
function updateCount(){const chosen=document.querySelectorAll('input[name=order]:checked').length;$('count').textContent='미발송 '+rows.length+'건 / 선택 '+chosen+'건';$('send').disabled=busy||!complete||!chosen||!document.querySelector('input[name=dept]:checked')}
function assertAdmin(){if(!profile || !(profile.role==='super_admin'||(profile.role==='staff'&&canonicalDepartment(profile.department)==='총무부')))throw Error('총무부 실무 회원 또는 슈퍼관리자만 발주를 송부할 수 있습니다.')}
async function authUser(){const {data,error}=await sb.auth.getUser();if(error||!data?.user)throw Error('로그인이 필요합니다.');const p=await sb.from('profiles').select('department,role').eq('id',data.user.id).single();if(p.error||!p.data)throw Error('프로필 조회 실패: '+(p.error?.message||''));profile=p.data;assertAdmin();$('identity').textContent='소속 '+profile.department+' | 권한 '+profile.role;$('workspace').hidden=false}
async function login(){if(busy)return;setBusy(true);try{const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!key)throw Error('Supabase 주소 및 공개 키를 확인하세요.');const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');sb=createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});let {data}=await sb.auth.getUser();if(!data?.user){const result=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(result.error)throw result.error;}await authUser();localStorage.setItem('jinil_config',JSON.stringify({url,key}));log('로그인 완료. 목록 조회 중입니다.');await reload()}catch(e){$('workspace').hidden=true;log('연결 오류: '+e.message)}finally{setBusy(false)}}
async function reload(){if(!sb||!profile)return;complete=false;rows=[];render();setBusy(true);
try{assertAdmin();
let orders=[],offset=0,page;do{const r=await sb.from('jinil_orders').select('id,order_no,payload,created_at').order('created_at',{ascending:false}).range(offset,offset+499);if(r.error)throw r.error;page=r.data||[];orders.push(...page);offset+=page.length}while(page.length===500&&offset<10000);
if(page.length===500&&offset===10000)throw Error('발주 10,000건 초과: 전체 조회가 불가능하여 송부를 중단했습니다.');
const dispatched=new Set();
for(let i=0;i<orders.length;i+=100){const ids=orders.slice(i,i+100).map(o=>o.id);if(!ids.length)continue;const r=await sb.from('jinil_dispatches').select('order_id').in('order_id',ids);if(r.error)throw r.error;(r.data||[]).forEach(d=>dispatched.add(String(d.order_id)))}
rows=orders.filter(o=>!dispatched.has(String(o.id)));complete=true;render();log('서버 미발송 '+rows.length+'건을 조회했습니다. 다른 기기에서 송부했을 수 있으므로 발송 직전 다시 확인합니다.')
}catch(e){rows=[];render();log('조회 오류: '+e.message+' (목록 불완전, 송부 차단)')}finally{setBusy(false)}}
function render(){const list=$('orders');list.replaceChildren();for(const o of rows){const label=document.createElement('label');label.className='entry';const cb=document.createElement('input');cb.type='checkbox';cb.name='order';cb.value=o.id;cb.addEventListener('change',updateCount);const s=document.createElement('span');s.textContent=[o.order_no,o.payload?.company,o.payload?.item,o.created_at?.slice(0,10)].filter(Boolean).join(' / ');label.append(cb,s);list.append(label)}if(!rows.length)list.textContent='조회 가능한 미발송 발주가 없습니다.';updateCount()}
async function send(){if(busy||!complete)return;const ids=[...document.querySelectorAll('input[name=order]:checked')].map(c=>c.value),deps=[...document.querySelectorAll('input[name=dept]:checked')].map(c=>c.value);if(!ids.length||!deps.length)return;
setBusy(true);let sent=0;try{assertAdmin();for(const id of ids){const check=await sb.from('jinil_dispatches').select('id').eq('order_id',id).limit(1);if(check.error)throw check.error;if(check.data?.length)throw Error('다른 기기에서 이미 송부한 발주 발견. 중복 방지를 위해 중단했습니다.');
await sendOrder(sb,{orderId:id,recipients:deps});sent++;log('송부 처리 '+sent+'/'+ids.length+'건. 서버 송부 기록 저장됨 (실기기 수신 확인 전).')}
log('선택한 '+sent+'건의 서버 송부 기록 저장 완료. 실제 부서 수신은 별도 확인 필요.')
}catch(e){log('송부 중단: '+sent+'건 처리 후 오류: '+e.message+'\n서버에 부분 반영됐을 수 있으므로 목록을 확인하세요.')}finally{setBusy(false);await reload()}}
$('login').onclick=login;$('logout').onclick=async()=>{if(sb)await sb.auth.signOut();profile=null;rows=[];complete=false;$('workspace').hidden=true;$('identity').textContent='로그인 전';log('로그아웃했습니다.')};
$('reload').onclick=reload;$('all').onclick=()=>{document.querySelectorAll('input[name=order]').forEach(x=>x.checked=true);updateCount()};$('none').onclick=()=>{document.querySelectorAll('input[name=order]').forEach(x=>x.checked=false);updateCount()};
document.querySelectorAll('input[name=dept]').forEach(x=>x.addEventListener('change',updateCount));$('send').onclick=send;
</script></main></body></html>
