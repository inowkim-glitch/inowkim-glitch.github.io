<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>진일 | 기타블록 캡처블록</title><link rel="stylesheet" href="../../department.css"><style>body{padding:16px}main{max-width:1060px;margin:auto;background:white;border:1px solid #dce6df;border-radius:16px;padding:22px}h1{font-size:23px}p{line-height:1.6}.warning{padding:12px;border:1px solid #dfc89b;border-radius:9px;background:#fff8e9;color:#72501d}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}input,select,textarea{padding:9px;border:1px solid #bacbbc;border-radius:8px;max-width:100%;font:inherit}button{background:#24523d;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer}button:disabled{opacity:.5}.tools input{flex:1;min-width:160px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{display:grid;gap:5px;font-size:13px;font-weight:700}label input,label textarea{width:100%}#records{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #dce4dc;padding:11px 8px;text-align:left;vertical-align:top;font-size:13px}td{overflow-wrap:anywhere}th{background:#f5f8f5}.secondary{background:#e9eee9;color:#234}#status{color:#536c59;font-size:13px}.panel{border:1px solid #dce5dd;padding:16px;border-radius:12px;margin:14px 0}@media(max-width:600px){main{padding:14px}table{min-width:640px}}</style></head><body><main><p><a href="../../index.html">← WORKSPACE</a></p><h1>기타블록 · 캡처블록</h1><p class="warning">이 블록은 브라우저의 화면 공유 권한을 받아 한 장의 PNG를 캡처하는 시험 기능입니다. 권한 거부 시 캡처하지 않습니다. 서버에 저장하지 않습니다.</p><div class="tools"><button id="capture">화면 선택하고 캡처</button><button id="save" disabled>PNG 저장</button></div><p id="status" role="status"></p><img id="preview" alt="캡처 미리보기" style="max-width:100%"><script>const b=document.getElementById('capture'),s=document.getElementById('save'),p=document.getElementById('preview'),t=document.getElementById('status');let blob=null;b.onclick=async()=>{let stream;try{if(!navigator.mediaDevices?.getDisplayMedia)throw Error('이 브라우저는 화면 캡처를 지원하지 않습니다.');stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const video=document.createElement('video');video.srcObject=stream;await video.play();await new Promise(r=>{if(video.videoWidth)r();else video.onloadedmetadata=r});const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('캡처 실패');p.src=URL.createObjectURL(blob);s.disabled=false;t.textContent='캡처 완료. 파일은 아직 로컬에만 있습니다.';}catch(e){t.textContent=e.message}finally{stream?.getTracks().forEach(x=>x.stop());}};s.onclick=()=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='jinil_capture.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></main></body></html>
