<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>진일 | 기타블록 CAD3D생성블록</title><link rel="stylesheet" href="../../department.css"><style>body{padding:16px}main{max-width:1060px;margin:auto;background:white;border:1px solid #dce6df;border-radius:16px;padding:22px}h1{font-size:23px}p{line-height:1.6}.warning{padding:12px;border:1px solid #dfc89b;border-radius:9px;background:#fff8e9;color:#72501d}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}input,select,textarea{padding:9px;border:1px solid #bacbbc;border-radius:8px;max-width:100%;font:inherit}button{background:#24523d;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer}button:disabled{opacity:.5}.tools input{flex:1;min-width:160px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{display:grid;gap:5px;font-size:13px;font-weight:700}label input,label textarea{width:100%}#records{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #dce4dc;padding:11px 8px;text-align:left;vertical-align:top;font-size:13px}td{overflow-wrap:anywhere}th{background:#f5f8f5}.secondary{background:#e9eee9;color:#234}#status{color:#536c59;font-size:13px}.panel{border:1px solid #dce5dd;padding:16px;border-radius:12px;margin:14px 0}@media(max-width:600px){main{padding:14px}table{min-width:640px}}</style></head><body><main><p><a href="../../index.html">← WORKSPACE</a></p><h1>기타블록 · CAD3D생성블록</h1><p class="warning">3D 변환 엔진 연결 전입니다. 아래 기능은 치수를 입력해 단순 직육면체 STL을 생성하는 독립 시험 기능이며, 2D CAD 자동 변환이 아닙니다.</p><section class="panel"><div class="fields"><label>가로 mm<input id="w" type="number" min=".1" step="any" value="50"></label><label>세로 mm<input id="h" type="number" min=".1" step="any" value="30"></label><label>높이 mm<input id="d" type="number" min=".1" step="any" value="10"></label></div><div class="tools"><button id="make">직육면체 STL 생성</button></div><p id="status" role="status"></p></section><script>const $=x=>document.getElementById(x);$('make').onclick=()=>{const a=+$('w').value,b=+$('h').value,c=+$('d').value;if(![a,b,c].every(n=>Number.isFinite(n)&&n>0&&n<=100000)){ $('status').textContent='유효한 양수 치수를 입력하세요.';return;}const v=[[0,0,0],[a,0,0],[a,b,0],[0,b,0],[0,0,c],[a,0,c],[a,b,c],[0,b,c]],q=[[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]];let s='solid box\n';for(const t of q){const p=t.map(i=>v[i]),u=p[1].map((n,i)=>n-p[0][i]),z=p[2].map((n,i)=>n-p[0][i]),n=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]],m=Math.hypot(...n)||1;s+='facet normal '+n.map(x=>x/m).join(' ')+'\n outer loop\n'+p.map(x=>'vertex '+x.join(' ')).join('\n')+'\n endloop\nendfacet\n';}s+='endsolid box\n';const url=URL.createObjectURL(new Blob([s],{type:'model/stl'}));const a=document.createElement('a');a.href=url;a.download='jinil_box.stl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='직육면체 STL 파일 생성됨. CAD 도면 변환은 미구현입니다.';};</script></main><script src="../../common/pointer-wheel.js" defer></script>
</body></html>
